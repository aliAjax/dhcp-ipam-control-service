<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DHCP IPAM Control</title>
  <style>body{font:16px system-ui;margin:3rem;background:#f4f6f8;color:#16202a}main{max-width:50rem;margin:auto;background:#fff;padding:2rem;border:1px solid #d9e0e7;border-radius:8px}h1{margin-top:0}button{padding:.6rem 1rem;border:0;border-radius:4px;background:#146c94;color:#fff;cursor:pointer}#status{margin-top:1rem}</style>
</head>
<body><main><h1>DHCP IPAM Control</h1><p>Operations console</p><button id="refresh">Refresh health</button><div id="status">Ready</div></main>
<script>document.getElementById('refresh').onclick=async()=>{const r=await fetch('/healthz');document.getElementById('status').textContent=await r.text()}</script>
</body></html>
